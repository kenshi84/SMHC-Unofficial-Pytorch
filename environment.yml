name: smhc_torch
channels:
  - nvidia
  - pytorch
  - conda-forge
dependencies:
  # build and formatting tools
  - pip=24.2
  - setuptools
  - wheel
  - ninja

  # pytorch 2.4 stack (runtime)
  - pytorch=2.4.*
  - torchvision
  - pytorch-cuda=12.4
  
  - pip:
      - numpy==2.0.2
      - opencv-python==4.12.0.88
      - trimesh==4.6.12
      - pyyaml==6.0.1
      - Pillow==10.4.0
      - tqdm
      - zipp
      - pillow-avif-plugin